<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Subjects &amp; Books — CM Blueprint</title>
<link rel="stylesheet" href="./shared.css">
<style>
/* ---- Layout ---- */
.sb-toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
.sb-toolbar .filter-chips { display:flex; flex-wrap:wrap; gap:6px; }
.sb-toolbar .filter-chip { padding:4px 12px; border-radius:20px; border:1px solid var(--border); background:var(--milk-white); font-size:12px; cursor:pointer; color:var(--inkwell); }
.sb-toolbar .filter-chip.active { background:var(--wonder-marine); color:#fff; border-color:var(--wonder-marine); }

/* ---- Subject sections ---- */
.subject-section { margin-bottom:24px; }
.subject-section-header { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--field-mint); border:1px solid var(--border); border-radius:6px 6px 0 0; }
.subject-section-header h2 { margin:0; font-size:14px; font-weight:700; color:var(--navy-story); flex:1; }
.subject-section-header .add-card-btn { font-size:12px; padding:3px 10px; border-radius:4px; border:1px solid var(--wonder-marine); background:transparent; color:var(--wonder-marine); cursor:pointer; }
.subject-section-header .add-card-btn:hover { background:var(--wonder-marine); color:#fff; }
.subject-cards { border:1px solid var(--border); border-top:none; border-radius:0 0 6px 6px; overflow:hidden; }
.subject-cards.empty { padding:12px 14px; font-size:13px; color:var(--muted); font-style:italic; }

/* ---- Work item row ---- */
.work-item { display:flex; align-items:flex-start; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--milk-white); }
.work-item:last-child { border-bottom:none; }
.work-item.filtered-out { display:none; }
.work-item-main { flex:1; min-width:0; }
.work-item-title { font-size:14px; font-weight:600; color:var(--inkwell); margin-bottom:4px; }
.work-item-meta { font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:8px; }
.work-item-badges { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }

/* ---- Badges ---- */
.badge { display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; white-space:nowrap; }
.badge-planning-active { background:#e6f4ea; color:#1a6e35; }
.badge-planning-optional { background:#fff3cd; color:#7a5c00; }
.badge-planning-not-this-year { background:#f0f0f0; color:#666; }
.badge-planning-coop { background:#e3edfb; color:#1c4fad; }
.badge-planning-practice { background:#f3eafb; color:#6a2fa0; }
.badge-coverage-covered { background:#e6f4ea; color:#1a6e35; }
.badge-coverage-needs-books { background:#fff0e0; color:#8a4500; }
.badge-coverage-need-to-choose { background:#fff3cd; color:#7a5c00; }
.badge-coverage-no-resource { background:#f0f0f0; color:#666; }
.badge-coverage-not-tracked { background:#fce8e8; color:#9b2020; }
.badge-coverage-partial { background:#fff3cd; color:#7a5c00; }

/* ---- Who badge ---- */
.badge-who { background:var(--field-mint); color:var(--navy-story); }

/* ---- Edit button ---- */
.edit-btn { flex-shrink:0; padding:4px 10px; font-size:12px; border:1px solid var(--border); border-radius:4px; background:var(--milk-white); color:var(--muted); cursor:pointer; }
.edit-btn:hover { border-color:var(--wonder-marine); color:var(--wonder-marine); }

/* ---- Overlay ---- */
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; align-items:flex-start; justify-content:center; padding:40px 16px; }
.overlay.open { display:flex; }
.overlay-panel { background:#fff; border-radius:10px; box-shadow:0 8px 32px rgba(0,0,0,0.18); width:100%; max-width:520px; max-height:85vh; overflow-y:auto; padding:24px; }
.overlay-panel h2 { margin:0 0 16px; font-size:17px; color:var(--navy-story); }
.form-row { margin-bottom:14px; }
.form-row label { display:block; font-size:12px; font-weight:600; color:var(--inkwell); margin-bottom:4px; }
.form-row input, .form-row select, .form-row textarea { width:100%; box-sizing:border-box; padding:7px 10px; border:1px solid var(--border); border-radius:5px; font-size:14px; font-family:inherit; background:var(--milk-white); color:var(--inkwell); }
.form-row textarea { min-height:72px; resize:vertical; }
.form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
.btn-primary { padding:7px 20px; border-radius:5px; border:none; background:var(--wonder-marine); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
.btn-primary:hover { background:#135a65; }
.btn-secondary { padding:7px 16px; border-radius:5px; border:1px solid var(--border); background:var(--milk-white); color:var(--inkwell); font-size:14px; cursor:pointer; }
.btn-secondary:hover { border-color:var(--muted); }
.btn-danger { padding:7px 14px; border-radius:5px; border:1px solid #d9534f; background:transparent; color:#c0392b; font-size:13px; cursor:pointer; }

/* ---- Resource editor inside overlay ---- */
.resource-list-editor { border:1px solid var(--border); border-radius:5px; margin-bottom:6px; overflow:hidden; }
.resource-row { display:flex; align-items:center; gap:8px; padding:7px 10px; border-bottom:1px solid var(--border); background:var(--milk-white); }
.resource-row:last-child { border-bottom:none; }
.resource-row input, .resource-row select { flex:1; min-width:0; padding:5px 8px; border:1px solid var(--border); border-radius:4px; font-size:13px; font-family:inherit; background:#fff; }
.resource-row .remove-res-btn { flex-shrink:0; padding:3px 8px; font-size:11px; border:1px solid var(--border); border-radius:4px; cursor:pointer; color:var(--muted); background:transparent; }
.resource-row .remove-res-btn:hover { border-color:#c0392b; color:#c0392b; }
.add-resource-row-btn { font-size:12px; color:var(--wonder-marine); background:transparent; border:none; cursor:pointer; padding:4px 0 0; }
.add-resource-row-btn:hover { text-decoration:underline; }

/* ---- Notes ---- */
.work-item-notes { font-size:12px; color:var(--muted); font-style:italic; margin-top:4px; }

/* ---- Form badge ---- */
.badge-form { background:#f0f4ff; color:#2a4a9e; border:1px solid #c8d5f5; }

/* ---- Section with color dot ---- */
.col-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; display:inline-block; }
</style>
</head>
<body>
<div id="app-header"></div>

<div class="page-wrap">
  <h1 class="page-title">Subjects &amp; Books</h1>
  <p class="sub">Your planning workbench. Add work items, choose resources, and decide what's active or optional this year.</p>

  <div class="sb-toolbar">
    <div class="filter-chips" id="learner-filter-chips">
      <button class="filter-chip active" data-learner="all">Everyone</button>
    </div>
    <div style="flex:1"></div>
    <button class="btn-primary" id="add-item-btn" style="font-size:13px;padding:5px 14px;">+ Add work item</button>
  </div>

  <div id="subjects-list"></div>
</div>

<!-- Work item editor overlay -->
<div class="overlay" id="item-editor-overlay">
  <div class="overlay-panel">
    <h2 id="item-editor-title">Add work item</h2>

    <div class="form-row">
      <label for="item-title">Title</label>
      <input type="text" id="item-title" placeholder="e.g. Narration, Nature Study, Grammar…">
    </div>

    <div class="form-row">
      <label for="item-subject">Subject / column</label>
      <select id="item-subject"></select>
    </div>

    <div class="form-row">
      <label for="item-planning-status">Planning status</label>
      <select id="item-planning-status">
        <option value="active">Active — we're doing this term</option>
        <option value="optional">Optional — nice to include</option>
        <option value="not-this-year">Not this year</option>
        <option value="co-op-external">Co-op / External</option>
        <option value="practice-no-book">Practice — no book needed</option>
      </select>
    </div>

    <div class="form-row">
      <label>Form / stage applicability</label>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:2px;">
        <label style="display:flex;align-items:center;gap:5px;font-size:13px;font-weight:400;cursor:pointer;">
          <input type="checkbox" id="fa-form1" value="form1"> Form I
        </label>
        <label style="display:flex;align-items:center;gap:5px;font-size:13px;font-weight:400;cursor:pointer;">
          <input type="checkbox" id="fa-form2" value="form2"> Form II
        </label>
        <label style="display:flex;align-items:center;gap:5px;font-size:13px;font-weight:400;cursor:pointer;">
          <input type="checkbox" id="fa-form3" value="form3"> Form III+
        </label>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px;">Leave all unchecked for "All forms / Family".</div>
    </div>

    <div class="form-row">
      <label for="item-audience">Who is this for?</label>
      <select id="item-audience"></select>
    </div>

    <div class="form-row">
      <label>Resources (books, curricula, materials)</label>
      <div class="resource-list-editor" id="resource-rows"></div>
      <button class="add-resource-row-btn" id="add-resource-row-btn">+ Add resource</button>
    </div>

    <div class="form-row">
      <label for="item-notes">Notes</label>
      <textarea id="item-notes" placeholder="Optional — approach, method, source, anything you want to remember."></textarea>
    </div>

    <div class="form-actions">
      <button class="btn-danger" id="item-delete-btn" style="display:none;margin-right:auto;">Delete</button>
      <button class="btn-secondary" id="item-cancel-btn">Cancel</button>
      <button class="btn-primary" id="item-save-btn">Save</button>
    </div>
  </div>
</div>

<script type="module">
import { appHeaderHTML } from './nav.mjs';
import * as A from '../../lib/familyMapAdapter.mjs';
import * as M from '../../lib/familyMap.mjs';

document.getElementById('app-header').outerHTML = appHeaderHTML('subjects');

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const STORAGE_KEY = 'cmblueprint.familySchoolMap.v1';
let state = null;
let activeLearnerFilter = 'all';
let editingCardId = null;
let pendingResources = []; // [{id, title, type, status}] for the open editor

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.appStateVersion) return parsed;
    }
  } catch (e) { /* ignore */ }
  return A.buildSampleAppState();
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}

state = loadState();

// ---------------------------------------------------------------------------
// Badge helpers
// ---------------------------------------------------------------------------
const PLANNING_CLASS = {
  'active': 'badge-planning-active',
  'optional': 'badge-planning-optional',
  'not-this-year': 'badge-planning-not-this-year',
  'co-op-external': 'badge-planning-coop',
  'practice-no-book': 'badge-planning-practice'
};
const PLANNING_LABEL = M.PLANNING_STATUS_LABELS || {
  'active': 'Active', 'optional': 'Optional', 'not-this-year': 'Not this year',
  'co-op-external': 'Co-op / External', 'practice-no-book': 'Practice'
};
const COVERAGE_CLASS = {
  'covered': 'badge-coverage-covered',
  'needs-books': 'badge-coverage-needs-books',
  'need-to-choose': 'badge-coverage-need-to-choose',
  'no-resource-needed': 'badge-coverage-no-resource',
  'not-tracked': 'badge-coverage-not-tracked',
  'partial': 'badge-coverage-partial'
};
const COVERAGE_LABEL = M.COVERAGE_STATUS_LABELS || {
  'covered': 'Covered', 'needs-books': 'Needs books', 'need-to-choose': 'Need to choose',
  'no-resource-needed': 'No resource needed', 'not-tracked': 'No resource tracked', 'partial': 'Partially covered'
};

function formApplicabilityLabel(fa) {
  if (!fa || !fa.length) return 'All forms';
  const has1 = fa.includes('form1'), has2 = fa.includes('form2'), has3 = fa.includes('form3');
  if (has1 && has2 && has3) return 'All forms';
  if (has1 && has2 && !has3) return 'Forms I–II';
  if (!has1 && has2 && has3) return 'Forms II–III';
  if (has1 && !has2 && has3) return 'Forms I & III';
  if (has1 && !has2 && !has3) return 'Form I';
  if (!has1 && has2 && !has3) return 'Form II';
  if (!has1 && !has2 && has3) return 'Form III+';
  return fa.join(', ');
}

function planningBadge(ps) {
  const cls = PLANNING_CLASS[ps] || 'badge-planning-active';
  const lbl = PLANNING_LABEL[ps] || ps;
  return `<span class="badge ${cls}">${lbl}</span>`;
}

function coverageBadge(cs) {
  if (cs === 'covered') return ''; // don't clutter covered items
  const cls = COVERAGE_CLASS[cs] || 'badge-coverage-not-tracked';
  const lbl = COVERAGE_LABEL[cs] || cs;
  return `<span class="badge ${cls}">${lbl}</span>`;
}

function whoBadge(card) {
  if (card.participantMode === 'together') return '<span class="badge badge-who">Together</span>';
  if (card.participantMode === 'coop') return '<span class="badge badge-planning-coop">Co-op</span>';
  if (card.participantMode === 'optional') return '';
  const ids = card.participantIds || [];
  if (!ids.length) return '';
  return ids.map(id => {
    const g = state.groups.find(g => g.id === id);
    if (g) return `<span class="badge badge-who">${g.label}</span>`;
    const s = state.students.find(s => s.id === id);
    if (s) return `<span class="badge badge-who" style="background:${s.color}20;color:${s.color};">${s.name}</span>`;
    return '';
  }).join('');
}

// ---------------------------------------------------------------------------
// Learner filter
// ---------------------------------------------------------------------------
function buildLearnerFilter() {
  const el = document.getElementById('learner-filter-chips');
  let html = `<button class="filter-chip${activeLearnerFilter === 'all' ? ' active' : ''}" data-learner="all">Everyone</button>`;
  state.students.filter(s => s.active).sort((a,b)=>a.sortOrder-b.sortOrder).forEach(s => {
    const active = activeLearnerFilter === s.id ? ' active' : '';
    html += `<button class="filter-chip${active}" data-learner="${s.id}" style="${active ? '' : `color:${s.color}`}">${s.name}</button>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeLearnerFilter = btn.dataset.learner;
      buildLearnerFilter();
      renderSubjects();
    });
  });
}

function cardMatchesLearnerFilter(card) {
  if (activeLearnerFilter === 'all') return true;
  return A.cardMatchesLens(card, { type: 'student', studentId: activeLearnerFilter }, state);
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function cardResourceSummary(card) {
  const uses = (state.resourceUses || []).filter(u => u.cardId === card.id);
  if (!uses.length) return null;
  return uses.map(u => {
    const res = (state.resources || []).find(r => r.id === u.resourceId);
    return res ? res.title : null;
  }).filter(Boolean).join(' · ');
}

function renderSubjects() {
  const container = document.getElementById('subjects-list');
  const visibleCols = state.subjectColumns.filter(c => c.visible).sort((a,b) => a.sortOrder - b.sortOrder);
  let html = '';
  visibleCols.forEach(col => {
    const cards = A.getCardsForSubjectColumn(state, col.id);
    const visibleCards = cards.filter(c => cardMatchesLearnerFilter(c));
    const dotColor = col.color || 'var(--wonder-marine)';
    html += `<div class="subject-section">
      <div class="subject-section-header">
        <span class="col-dot" style="background:${dotColor}"></span>
        <h2>${col.label}</h2>
        <button class="add-card-btn" data-col="${col.id}">+ Add</button>
      </div>`;

    if (!visibleCards.length) {
      html += `<div class="subject-cards empty">No work items${activeLearnerFilter !== 'all' ? ' for this learner' : ''} yet.</div>`;
    } else {
      html += `<div class="subject-cards">`;
      visibleCards.forEach(card => {
        const ps = card.planningStatus || 'active';
        const cs = A.getCoverageStatusForCard(state, card.id);
        const resSummary = cardResourceSummary(card);
        const faLabel = formApplicabilityLabel(card.formApplicability);
        const formBadgeHtml = faLabel !== 'All forms'
          ? `<span class="badge badge-form">${faLabel}</span>` : '';
        html += `<div class="work-item" data-card-id="${card.id}">
          <div class="work-item-main">
            <div class="work-item-title">${escapeHtml(card.title)}</div>
            <div class="work-item-badges">
              ${planningBadge(ps)}
              ${coverageBadge(cs)}
              ${whoBadge(card)}
              ${formBadgeHtml}
            </div>
            ${resSummary ? `<div class="work-item-notes">${escapeHtml(resSummary)}</div>` : ''}
            ${card.notes ? `<div class="work-item-notes">${escapeHtml(card.notes)}</div>` : ''}
          </div>
          <button class="edit-btn" data-edit-card="${card.id}">Edit</button>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });
  container.innerHTML = html;

  // Wire add-card buttons on column headers
  container.querySelectorAll('.add-card-btn').forEach(btn => {
    btn.addEventListener('click', () => openAddItem(btn.dataset.col));
  });

  // Wire edit buttons
  container.querySelectorAll('[data-edit-card]').forEach(btn => {
    btn.addEventListener('click', () => openEditItem(btn.dataset.editCard));
  });
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---------------------------------------------------------------------------
// Audience select options
// ---------------------------------------------------------------------------
function buildAudienceOptions(selectedMode, selectedIds) {
  const opts = [
    { value: 'together', label: 'Together (all family)' },
    ...state.groups.filter(g=>g.active).map(g => ({ value: 'group:' + g.id, label: g.label })),
    ...state.students.filter(s=>s.active).sort((a,b)=>a.sortOrder-b.sortOrder).map(s => ({ value: 'individual:' + s.id, label: s.name })),
    { value: 'coop-outside', label: 'Co-op / External' },
    { value: 'optional', label: 'Optional / Not placed' }
  ];
  // current value
  let currentVal = 'together';
  if (selectedMode === 'together') currentVal = 'together';
  else if (selectedMode === 'coop') currentVal = 'coop-outside';
  else if (selectedMode === 'optional') currentVal = 'optional';
  else if (selectedMode === 'group' && selectedIds && selectedIds[0]) currentVal = 'group:' + selectedIds[0];
  else if (selectedMode === 'individual' && selectedIds && selectedIds[0]) currentVal = 'individual:' + selectedIds[0];
  return opts.map(o => `<option value="${o.value}"${o.value === currentVal ? ' selected' : ''}>${escapeHtml(o.label)}</option>`).join('');
}

// ---------------------------------------------------------------------------
// Resource editor helpers
// ---------------------------------------------------------------------------
const RES_STATUS_OPTIONS = [
  { value: 'have-it', label: 'Have it' },
  { value: 'need-to-buy', label: 'Need to buy' },
  { value: 'need-to-choose', label: 'Need to choose' },
  { value: 'no-resource', label: 'No resource needed' }
];
const RES_TYPE_OPTIONS = [
  { value: 'book', label: 'Book' },
  { value: 'lesson-book', label: 'Lesson book / curriculum' },
  { value: 'online', label: 'Online / digital' },
  { value: 'kit', label: 'Kit / materials' },
  { value: 'no-resource', label: 'No resource' }
];

function renderResourceRows() {
  const container = document.getElementById('resource-rows');
  if (!pendingResources.length) {
    container.innerHTML = '';
    container.style.display = 'none';
    return;
  }
  container.style.display = '';
  container.innerHTML = pendingResources.map((r, i) => `
    <div class="resource-row" data-res-idx="${i}">
      <input type="text" class="res-title" placeholder="Resource title" value="${escapeHtml(r.title || '')}">
      <select class="res-status">
        ${RES_STATUS_OPTIONS.map(o => `<option value="${o.value}"${r.status===o.value?' selected':''}>${o.label}</option>`).join('')}
      </select>
      <button class="remove-res-btn" data-res-idx="${i}">&times;</button>
    </div>
  `).join('');

  container.querySelectorAll('.res-title').forEach((inp, i) => {
    inp.addEventListener('input', () => { pendingResources[i].title = inp.value; });
  });
  container.querySelectorAll('.res-status').forEach((sel, i) => {
    sel.addEventListener('change', () => { pendingResources[i].status = sel.value; });
  });
  container.querySelectorAll('.remove-res-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      pendingResources.splice(Number(btn.dataset.resIdx), 1);
      renderResourceRows();
    });
  });
}

// ---------------------------------------------------------------------------
// Editor overlay open/close
// ---------------------------------------------------------------------------
const overlay = document.getElementById('item-editor-overlay');
const titleEl = document.getElementById('item-editor-title');
const inputTitle = document.getElementById('item-title');
const selSubject = document.getElementById('item-subject');
const selPlanning = document.getElementById('item-planning-status');
const selAudience = document.getElementById('item-audience');
const inputNotes = document.getElementById('item-notes');
const deleteBtn = document.getElementById('item-delete-btn');

function populateSubjectSelect(selectedId) {
  const cols = state.subjectColumns.filter(c=>c.visible).sort((a,b)=>a.sortOrder-b.sortOrder);
  selSubject.innerHTML = cols.map(c => `<option value="${c.id}"${c.id===selectedId?' selected':''}>${escapeHtml(c.label)}</option>`).join('');
}

function setFormCheckboxes(fa) {
  ['form1', 'form2', 'form3'].forEach(f => {
    const el = document.getElementById('fa-' + f);
    if (el) el.checked = Array.isArray(fa) && fa.includes(f);
  });
}

function readFormCheckboxes() {
  return ['form1', 'form2', 'form3'].filter(f => {
    const el = document.getElementById('fa-' + f);
    return el && el.checked;
  });
}

function openAddItem(colId) {
  editingCardId = null;
  titleEl.textContent = 'Add work item';
  inputTitle.value = '';
  populateSubjectSelect(colId || (state.subjectColumns[0] && state.subjectColumns[0].id));
  selPlanning.value = 'active';
  selAudience.innerHTML = buildAudienceOptions('together', []);
  inputNotes.value = '';
  setFormCheckboxes([]);
  pendingResources = [];
  deleteBtn.style.display = 'none';
  renderResourceRows();
  overlay.classList.add('open');
  inputTitle.focus();
}

function openEditItem(cardId) {
  const card = A.findCard(state, cardId);
  if (!card) return;
  editingCardId = cardId;
  titleEl.textContent = 'Edit work item';
  inputTitle.value = card.title || '';
  populateSubjectSelect(card.subjectColumnId);
  selPlanning.value = card.planningStatus || 'active';
  selAudience.innerHTML = buildAudienceOptions(card.participantMode, card.participantIds);
  inputNotes.value = card.notes || '';
  setFormCheckboxes(card.formApplicability || []);
  // Load linked resources
  const uses = (state.resourceUses || []).filter(u => u.cardId === cardId);
  pendingResources = uses.map(u => {
    const res = (state.resources || []).find(r => r.id === u.resourceId);
    return res ? { _resId: res.id, _useId: u.id, title: res.title, status: res.status, type: res.type } : null;
  }).filter(Boolean);
  deleteBtn.style.display = '';
  renderResourceRows();
  overlay.classList.add('open');
  inputTitle.focus();
}

function closeOverlay() {
  overlay.classList.remove('open');
  editingCardId = null;
  pendingResources = [];
}

document.getElementById('item-cancel-btn').addEventListener('click', closeOverlay);
overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(); });

document.getElementById('add-resource-row-btn').addEventListener('click', () => {
  pendingResources.push({ title: '', status: 'need-to-choose', type: 'book' });
  renderResourceRows();
  // focus the new input
  const rows = document.querySelectorAll('.res-title');
  if (rows.length) rows[rows.length - 1].focus();
});

// ---------------------------------------------------------------------------
// Parse audience select value → participantMode + participantIds
// ---------------------------------------------------------------------------
function parseAudienceValue(val) {
  if (val === 'together') return { participantMode: 'together', participantIds: [], audience: 'together', status: 'active' };
  if (val === 'coop-outside') return { participantMode: 'coop', participantIds: [], audience: 'coop-outside', status: 'coop' };
  if (val === 'optional') return { participantMode: 'optional', participantIds: [], audience: 'optional', status: 'optional' };
  if (val.startsWith('group:')) {
    const id = val.slice('group:'.length);
    return { participantMode: 'group', participantIds: [id], audience: 'group', status: 'active' };
  }
  if (val.startsWith('individual:')) {
    const id = val.slice('individual:'.length);
    return { participantMode: 'individual', participantIds: [id], audience: 'individual', status: 'active' };
  }
  return { participantMode: 'together', participantIds: [], audience: 'together', status: 'active' };
}

// ---------------------------------------------------------------------------
// Save
// ---------------------------------------------------------------------------
document.getElementById('item-save-btn').addEventListener('click', () => {
  const title = inputTitle.value.trim();
  if (!title) { inputTitle.focus(); return; }
  const subjectColumnId = selSubject.value;
  const planningStatus = selPlanning.value;
  const audienceParsed = parseAudienceValue(selAudience.value);
  const notes = inputNotes.value.trim();
  const formApplicability = readFormCheckboxes();

  // Reconcile resources: update existing, add new, remove deleted
  // Collect resIds still present
  const stillPresentResIds = new Set(pendingResources.filter(r=>r._resId).map(r=>r._resId));

  if (editingCardId) {
    // Update card fields
    A.updateCard(state, editingCardId, {
      title, subjectColumnId, planningStatus, notes, formApplicability,
      ...audienceParsed
    });

    // Remove resourceUses + resources that were deleted in the editor
    const existingUses = (state.resourceUses || []).filter(u => u.cardId === editingCardId);
    existingUses.forEach(u => {
      if (!stillPresentResIds.has(u.resourceId)) {
        state.resourceUses = state.resourceUses.filter(r => r.id !== u.id);
        // Only remove resource if not used elsewhere
        const usedElsewhere = state.resourceUses.some(other => other.resourceId === u.resourceId);
        if (!usedElsewhere) {
          state.resources = state.resources.filter(r => r.id !== u.resourceId);
        }
      }
    });

    // Update existing resources title/status
    pendingResources.filter(r=>r._resId).forEach(r => {
      const res = state.resources.find(res => res.id === r._resId);
      if (res) { res.title = r.title; res.status = r.status; }
    });

    // Add new resources (no _resId)
    pendingResources.filter(r=>!r._resId && r.title.trim()).forEach(r => {
      const res = M.makeResource({ title: r.title.trim(), type: r.type || 'book', status: r.status });
      state.resources.push(res);
      state.resourceUses.push(M.makeResourceUse({ resourceId: res.id, cardId: editingCardId, subjectColumnId }));
    });
  } else {
    // Add new card
    const card = A.addCard(state, {
      title, subjectColumnId, planningStatus, notes, formApplicability,
      ...audienceParsed
    });
    // Add resources
    pendingResources.filter(r=>r.title.trim()).forEach(r => {
      const res = M.makeResource({ title: r.title.trim(), type: r.type || 'book', status: r.status });
      state.resources.push(res);
      state.resourceUses.push(M.makeResourceUse({ resourceId: res.id, cardId: card.id, subjectColumnId }));
    });
  }

  saveState();
  closeOverlay();
  renderSubjects();
});

// ---------------------------------------------------------------------------
// Delete
// ---------------------------------------------------------------------------
deleteBtn.addEventListener('click', () => {
  if (!editingCardId) return;
  if (!confirm('Delete this work item? This cannot be undone.')) return;
  // Remove linked resourceUses (and orphaned resources)
  const uses = (state.resourceUses || []).filter(u => u.cardId === editingCardId);
  uses.forEach(u => {
    state.resourceUses = state.resourceUses.filter(r => r.id !== u.id);
    const usedElsewhere = state.resourceUses.some(other => other.resourceId === u.resourceId);
    if (!usedElsewhere) state.resources = state.resources.filter(r => r.id !== u.resourceId);
  });
  state.cards = state.cards.filter(c => c.id !== editingCardId);
  saveState();
  closeOverlay();
  renderSubjects();
});

// ---------------------------------------------------------------------------
// Global add button (no pre-selected column)
// ---------------------------------------------------------------------------
document.getElementById('add-item-btn').addEventListener('click', () => {
  openAddItem(null);
});

// ---------------------------------------------------------------------------
// Initial render
// ---------------------------------------------------------------------------
buildLearnerFilter();
renderSubjects();
</script>
</body>
